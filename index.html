:root{color-scheme:dark;--bg:#0b1019;--card:#192333;--card2:#202e42;--ink:#eef3fa;--muted:#9caec7;--accent:#a9c9fb;--line:#2d3b4f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent)}.app{max-width:1160px;margin:auto;display:flex;min-height:100vh}.sidebar{width:208px;border-right:1px solid var(--line);padding:28px 14px;display:none;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;font-size:23px;font-weight:800;letter-spacing:.01em}.brand-logo{width:52px;height:52px;border-radius:14px;object-fit:cover;flex-shrink:0}.brand-title{line-height:1.15}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:400}.sidebtn{display:flex;align-items:center;width:100%;background:none;border:0;color:var(--muted);padding:13px 12px;text-align:left;border-radius:12px;margin-top:6px}.sidebtn.active{background:var(--card2);color:var(--ink)}main{width:100%;min-width:0;padding:24px 16px 105px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}.head h1{font-size:23px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:5px}.card{background:var(--card);border:1px solid #253247;border-radius:17px;padding:15px;margin-bottom:12px}.card h2{font-size:15px;margin:0 0 12px}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--card2);border-radius:12px;padding:12px}.stat b{font-size:23px;display:block;margin-top:4px}.chip{border:0;background:#2c3d55;color:#dce9fa;border-radius:8px;padding:5px 9px;font-size:11px;white-space:nowrap}.chip.high{color:#ffc2b5}.chip.normal{color:#c3d8ff}.chip.low{color:#b5e5d4}.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:0}.item .grow{flex:1;min-width:0}.item .name{font-size:13px;overflow-wrap:anywhere}.item.done .name{text-decoration:line-through;color:var(--muted)}.item .meta{color:var(--muted);font-size:11px;margin-top:4px}.check{appearance:none;width:19px;height:19px;flex-shrink:0;border:1.5px solid #90a4c0;border-radius:6px;background:none}.check:checked{background:#91b8ef;border-color:#91b8ef}.action{border:0;border-radius:10px;padding:9px 12px;background:#314e78;color:#fff;font-size:13px}.ghost{background:#26354a;color:#d5e3f8}.danger{background:#613a44}.iconbtn{background:none;border:0;color:var(--muted);padding:6px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{border:0;border-radius:9px;background:var(--card);color:var(--muted);padding:8px 13px;white-space:nowrap}.tabs button.active{background:#314e78;color:white}.bottom{position:fixed;bottom:0;left:0;right:0;background:#111a28;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:5}.bottom button{border:0;background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:55px}.bottom button.active{color:var(--accent)}.bottom .sym{font-size:21px}.field{width:100%;border:1px solid #39485f;background:#111b2a;color:white;border-radius:10px;padding:12px;min-height:43px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid label{font-size:12px;color:var(--muted);display:block}.formgrid label>*{margin-top:5px}.formgrid .wide{grid-column:1/-1}.formactions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.overlay{position:fixed;inset:0;background:#000a;z-index:10;display:flex;align-items:flex-end;justify-content:center}.modal{background:#192333;width:100%;max-width:540px;max-height:92vh;overflow:auto;padding:19px;border-radius:22px 22px 0 0}.modal h2{margin:0 0 16px}.monthbar{display:flex;align-items:center;justify-content:space-between}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:13px 0}.day{border:0;background:#233147;color:#e8f0fa;border-radius:9px;min-height:48px;padding:4px;font-size:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}.day.selected{background:#385a86}.day.blank{background:transparent}.dots{font-size:8px;color:#b3d4ff;line-height:7px}.progress{height:7px;background:#34445c;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#a9c9fb}.project{cursor:pointer}.project h3{margin:0 0 5px;font-size:15px}.project p{margin:0 0 13px;color:var(--muted);font-size:12px}.note{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:#d4e0ef}.empty{color:var(--muted);font-size:13px;padding:12px 0}.bubble{padding:12px;border-radius:13px;margin:10px 0;font-size:13px;line-height:1.65}.bubble.user{background:#2b4261;margin-left:14%}.bubble.ai{background:#243348;margin-right:10%}.quick{display:flex;gap:8px}.quick input{flex:1;min-width:0}.hint{font-size:11px;color:var(--muted);line-height:1.5}.alert{background:#283b53;border-radius:10px;padding:11px;font-size:12px;line-height:1.5}.pill{font-size:11px;color:#b5d3ff;background:#30445f;border-radius:6px;padding:3px 7px}.topactions{display:flex;gap:6px}.topactions button{font-size:12px}.hidden{display:none!important}@media(min-width:760px){.sidebar{display:block}main{padding:33px 30px 50px}.bottom{display:none}.modal{border-radius:20px;align-self:center}.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dashboard .card{margin:0}.dashboard .span2{grid-column:1/-1}}

.brief-toggle{border:1px solid #405777;background:#23344d;color:#dceafd;border-radius:10px;padding:9px 12px;width:100%;margin-top:11px;text-align:center}.brief-detail{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.brief-detail p{font-size:12px;line-height:1.65;color:#d9e5f6;margin:7px 0}.brief-lead{font-size:13px;line-height:1.7;color:#e2ecf9}.brief-title{display:flex;align-items:center;gap:8px}.brief-title .pill{margin-left:auto}.home-dashboard{padding-bottom:86px}.home-dashboard .card{min-width:0}.home-dashboard .home-brief{border-color:#3a5378;background:linear-gradient(140deg,#1b2c45,#192333 70%)}.home-quickbar{position:fixed;bottom:67px;left:10px;right:10px;z-index:6;max-width:1120px;margin:auto;background:#17263a;border:1px solid #4a6385;box-shadow:0 7px 28px #0009;border-radius:16px;padding:8px 10px;display:flex;align-items:center;gap:8px}.home-quickbar .field{background:transparent;border:0;min-height:40px;padding:8px 4px}.home-quickbar .field:focus-visible{outline:none}.home-quickbar .action{white-space:nowrap}.home-quick-label{font-size:18px;color:#a9c9fb}.home-section-note{color:var(--muted);font-size:11px;margin:-5px 0 9px}.home-list-count{color:var(--muted);font-size:11px}.home-brief .alert{background:transparent;padding:0}.home-brief .hint{margin-top:8px}.home-due{color:#ffc2b5}.home-dashboard .item{min-width:0}@media(min-width:760px){.home-quickbar{bottom:16px;left:calc(208px + (100vw - min(100vw,1160px))/2 + 30px);right:calc((100vw - min(100vw,1160px))/2 + 30px);max-width:none}.home-dashboard{padding-bottom:85px}.home-dashboard .home-brief{grid-column:1/-1}.home-dashboard .home-stats{grid-column:1/-1}.home-dashboard .home-tasks{grid-column:1/2}.home-dashboard .home-upcoming{grid-column:2/3}.home-dashboard .home-projects{grid-column:1/-1}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><img class="brand-logo" src="icon-192.png" alt="홍 로고"><div class="brand-title">홍<small>HONG AI · PERSONAL ASSISTANT</small></div></div><div id="sideNav" style="margin-top:28px"></div></aside><main><header class="head"><div><h1 id="pageTitle">오늘의 홍</h1><div class="sub" id="pageSub"></div></div><div class="topactions"><button class="action ghost" onclick="openForm('task')">+ 할 일</button><button class="action" onclick="openForm('quick')">+ 등록</button></div></header><div id="content"></div></main></div><nav class="bottom" id="bottomNav"></nav><div id="modalRoot"></div><script>
const KEY='hong_v01_data';const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const initial={tasks:[],events:[],projects:[],notes:[],chat:[]};let data;try{data={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data=structuredClone(initial)};let page='home',filter='all',selected=today(),month=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0'),projectFocus=null;const labels={home:'홈',calendar:'캘린더',tasks:'할 일',projects:'프로젝트',ai:'홍 AI',notes:'메모·기록'},symbols={home:'⌂',calendar:'▦',tasks:'☑',projects:'▤',ai:'✧',notes:'▧'};const uid=()=>String(Date.now())+Math.random().toString(36).slice(2,7);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{localStorage.setItem(KEY,JSON.stringify(data));render()};const fmt=d=>d?d.replaceAll('-','.'): '날짜 없음';const projectName=id=>data.projects.find(p=>p.id===id)?.name||'';const pchip=p=>`<span class="chip ${p==='높음'?'high':p==='낮음'?'low':'normal'}">${esc(p||'보통')}</span>`;function nav(p){page=p;projectFocus=null;render();window.scrollTo(0,0)}function renderNav(){document.getElementById('sideNav').innerHTML=Object.keys(labels).map(p=>`<button class="sidebtn ${page===p?'active':''}" onclick="nav('${p}')">${symbols[p]}　${labels[p]}</button>`).join('');document.getElementById('bottomNav').innerHTML=['home','calendar','tasks','projects','ai'].map(p=>`<button class="${page===p?'active':''}" onclick="nav('${p}')"><span class="sym">${symbols[p]}</span>${labels[p]}</button>`).join('')}
function taskRow(t){return `<div class="item ${t.done?'done':''}"><input class="check" aria-label="완료" type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div class="grow" onclick="openForm('task','${t.id}')" style="cursor:pointer"><div class="name">${esc(t.title)}</div><div class="meta">${fmt(t.date)}${t.time?' · '+esc(t.time):''}${projectName(t.project)?' · '+esc(projectName(t.project)):''}${t.repeat&&t.repeat!=='none'?' · ↻ '+({daily:'매일',weekly:'매주',monthly:'매월'}[t.repeat]||'반복'):''}</div></div>${pchip(t.priority)}<button class="iconbtn" aria-label="수정" onclick="openForm('task','${t.id}')">✎</button></div>`}
function eventRow(e){return `<div class="item"><span style="color:#a9c9fb">◷</span><div class="grow" onclick="openForm('event','${e.id}')" style="cursor:pointer"><div class="name">${esc(e.title)}</div><div class="meta">${fmt(e.date)}${e.time?' · '+esc(e.time):''}${projectName(e.project)?' · '+esc(projectName(e.project)):''}${e.repeat&&e.repeat!=='none'?' · ↻ 반복':''}</div></div><button class="iconbtn" onclick="openForm('event','${e.id}')">✎</button></div>`}
function occurrences(o,date){if(!o.date||date<o.date)return false;if(o.date===date)return true;if(!o.repeat||o.repeat==='none')return false;const a=new Date(o.date+'T12:00'),b=new Date(date+'T12:00');if(o.repeat==='daily')return true;if(o.repeat==='weekly')return Math.round((b-a)/86400000)%7===0;if(o.repeat==='monthly')return a.getDate()===b.getDate();return false}
function tasksOn(date){return data.tasks.filter(t=>occurrences(t,date)&&!t.done)}function eventsOn(date){return data.events.filter(e=>occurrences(e,date))}function prioritySort(a,b){return ({'높음':0,'보통':1,'낮음':2}[a.priority]??1)-({'높음':0,'보통':1,'낮음':2}[b.priority]??1)}
let briefExpanded=false;
function recommendedHomeTasks(td){const open=data.tasks.filter(t=>!t.done);const todayAndOverdue=open.filter(t=>t.date&&t.date<=td||t.repeat&&t.repeat!=='none'&&occurrences(t,td));const unique=[...new Map(todayAndOverdue.map(t=>[t.id,t])).values()];return unique.sort((a,b)=>{const ad=a.date&&a.date<td&&!a.repeat,bd=b.date&&b.date<td&&!b.repeat;if(ad!==bd)return ad?-1:1;const p=prioritySort(a,b);if(p)return p;const da=(a.date||'9999-12-31')+' '+(a.time||'23:59'),db=(b.date||'9999-12-31')+' '+(b.time||'23:59');return da.localeCompare(db)})}
function toggleHomeBrief(){briefExpanded=!briefExpanded;render()}
function home(){const td=today(),due=data.tasks.filter(t=>!t.done&&t.date&&t.date<=td),open=data.tasks.filter(t=>!t.done),todayTasks=recommendedHomeTasks(td),soon=data.events.filter(e=>e.date>=td||e.repeat&&e.repeat!=='none'&&occurrences(e,td)).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,3),eventsToday=eventsOn(td),overdue=due.filter(t=>t.date<td),priority=todayTasks[0],projs=data.projects;let brief=overdue.length?`기한이 지난 미완료 업무가 ${overdue.length}개 있어요. 먼저 확인해 주세요.`:todayTasks.length?`오늘 처리할 업무가 ${todayTasks.length}개 있어요.`:'오늘 처리할 미완료 업무는 없어요.';brief+=eventsToday.length?` 오늘 일정은 ${eventsToday.length}개예요.`:' 오늘 등록된 일정은 없어요.';return `<div class="dashboard home-dashboard">
<section class="card home-brief"><h2 class="brief-title">✧ 홍의 오늘 브리핑 <span class="pill">규칙 기반</span></h2><div class="brief-lead">${brief}</div>${briefExpanded?`<div class="brief-detail"><p><b>추천 실행</b></p>${priority?`<p>① ${esc(priority.title)}${priority.date&&priority.date<td?' · 기한 지남':''}${priority.time?' · '+esc(priority.time):''}부터 확인해 보세요.</p>`:'<p>현재 추천할 미완료 업무가 없어요.</p>'}${soon.length?`<p>② 다음 일정: ${esc(soon[0].title)} · ${fmt(soon[0].date)}${soon[0].time?' '+esc(soon[0].time):''}</p>`:''}<p class="hint">현재는 중요도·기한·등록 일정을 이용한 기본 안내이며, 실제 AI 분석은 아직 연결되지 않았어요.</p><button class="action ghost" onclick="nav('ai')">홍 AI 화면으로 이동 ›</button></div>`:''}<button class="brief-toggle" onclick="toggleHomeBrief()">${briefExpanded?'브리핑 접기 ↑':'브리핑 펼쳐보기 ↓'}</button></section>
<section class="card home-stats"><h2>오늘의 현황 <span class="muted small">${fmt(td)}</span></h2><div class="stats"><div class="stat"><span class="small muted">오늘 일정</span><b>${eventsToday.length}</b></div><div class="stat"><span class="small muted">미완료 할 일</span><b>${open.length}</b></div><div class="stat"><span class="small muted">진행 프로젝트</span><b>${projs.length}</b></div></div></section>
<section class="card home-tasks"><div class="row between"><h2>오늘의 할 일</h2><button class="iconbtn" onclick="nav('tasks')">전체 ›</button></div><p class="home-section-note">홍 추천 실행 순서 · 중요도와 마감일 반영</p>${todayTasks.length?todayTasks.slice(0,5).map(taskRow).join(''):'<div class="empty">오늘 처리할 미완료 업무가 없어요.</div>'}${todayTasks.length>5?`<button class="iconbtn" onclick="nav('tasks')">나머지 ${todayTasks.length-5}개 보기 ›</button>`:''}</section>
<section class="card home-upcoming"><div class="row between"><h2>다가오는 일정</h2><button class="iconbtn" onclick="nav('calendar')">캘린더 ›</button></div>${soon.length?soon.map(eventRow).join(''):'<div class="empty">다가오는 일정이 없어요.</div>'}</section>
<section class="card home-projects"><div class="row between"><h2>프로젝트 진행 현황</h2><button class="iconbtn" onclick="nav('projects')">전체 ›</button></div>${projs.length?projs.slice(0,5).map(projectLine).join(''):'<div class="empty">프로젝트를 추가해 보세요.</div>'}</section>
</div><div class="home-quickbar"><span class="home-quick-label">✧</span><input class="field" id="homeQuick" aria-label="홍에게 바로 등록" placeholder="홍에게 일정이나 할 일을 말해줘" onkeydown="if(event.key==='Enter')quickParse(this.value)"><button class="action" onclick="quickParse(document.getElementById('homeQuick').value)">등록 ↑</button></div>`}
function projectLine(p){const ts=data.tasks.filter(t=>t.project===p.id),done=ts.filter(t=>t.done).length,percent=ts.length?Math.round(done/ts.length*100):0;return `<div style="margin:12px 0;cursor:pointer" onclick="openProject('${p.id}')"><div class="row between small"><span>${esc(p.name)}</span><span class="muted">${done}/${ts.length} · ${percent}%</span></div><div class="progress" style="margin-top:7px"><div style="width:${percent}%"></div></div></div>`}
function calendar(){const [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();let cells=Array.from({length:first},()=>'<div class="day blank"></div>').join('');for(let d=1;d<=days;d++){let date=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells+=`<button class="day ${selected===date?'selected':''}" onclick="selected='${date}';render()">${d}<span class="dots">${eventsOn(date).length?'●':''}${tasksOn(date).length?' ●':''}</span></button>`}return `<section class="card"><div class="monthbar"><button class="iconbtn" onclick="changeMonth(-1)">‹</button><b>${y}년 ${m}월</b><button class="iconbtn" onclick="changeMonth(1)">›</button></div><div class="calendar">${['일','월','화','수','목','금','토'].map(x=>`<div class="small muted" style="text-align:center">${x}</div>`).join('')}${cells}</div><div class="row between"><b>${fmt(selected)}</b><div><button class="action ghost" onclick="openForm('task')">+ 할 일</button> <button class="action" onclick="openForm('event')">+ 일정</button></div></div><h2 style="margin-top:20px">일정</h2>${eventsOn(selected).length?eventsOn(selected).map(eventRow).join(''):'<div class="empty">일정 없음</div>'}<h2 style="margin-top:18px">할 일 마감</h2>${tasksOn(selected).length?tasksOn(selected).map(taskRow).join(''):'<div class="empty">할 일 없음</div>'}</section>`}
function changeMonth(n){let [y,m]=month.split('-').map(Number);let d=new Date(y,m-1+n,1);month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');selected=month+'-01';render()}
function tasks(){let list=data.tasks.filter(t=>filter==='all'||(filter==='today'&&occurrences(t,today()))||(filter==='upcoming'&&!t.done&&t.date>today())||(filter==='done'&&t.done)).sort((a,b)=>Number(a.done)-Number(b.done)||prioritySort(a,b));return `<div class="tabs">${[['all','전체'],['today','오늘'],['upcoming','예정'],['done','완료']].map(([id,n])=>`<button class="${filter===id?'active':''}" onclick="filter='${id}';render()">${n}</button>`).join('')}</div><section class="card"><div class="row between"><h2>할 일 ${list.length}개</h2><button class="action" onclick="openForm('task')">+ 추가</button></div>${list.length?list.map(taskRow).join(''):'<div class="empty">해당하는 할 일이 없어요.</div>'}</section>`}
function projects(){if(projectFocus){const p=data.projects.find(x=>x.id===projectFocus);if(!p){projectFocus=null;return projects()}return `<button class="iconbtn" onclick="projectFocus=null;render()">‹ 프로젝트 목록</button><section class="card"><div class="row between"><h2>${esc(p.name)}</h2><button class="action ghost" onclick="openForm('project','${p.id}')">수정</button></div><p class="muted small">${esc(p.goal||'목표를 설정해 보세요.')}</p>${projectLine(p)}</section><section class="card"><div class="row between"><h2>연결된 할 일</h2><button class="action" onclick="openForm('task',null,'${p.id}')">+ 추가</button></div>${data.tasks.filter(t=>t.project===p.id).map(taskRow).join('')||'<div class="empty">할 일이 없어요.</div>'}</section><section class="card"><div class="row between"><h2>연결된 일정</h2><button class="action" onclick="openForm('event',null,'${p.id}')">+ 추가</button></div>${data.events.filter(e=>e.project===p.id).map(eventRow).join('')||'<div class="empty">일정이 없어요.</div>'}</section><section class="card"><div class="row between"><h2>연결된 메모</h2><button class="action" onclick="openForm('note',null,'${p.id}')">+ 추가</button></div>${data.notes.filter(n=>n.project===p.id).map(noteRow).join('')||'<div class="empty">메모가 없어요.</div>'}</section>`}return `<div class="row between" style="margin-bottom:12px"><span class="muted small">프로젝트 ${data.projects.length}개</span><button class="action" onclick="openForm('project')">+ 새 프로젝트</button></div>${data.projects.length?data.projects.map(p=>`<section class="card project" onclick="openProject('${p.id}')"><h3>${esc(p.name)}</h3><p>${esc(p.goal||'목표 없음')}</p>${projectLine(p)}</section>`).join(''):'<section class="card empty">프로젝트를 만들어 목표와 할 일을 연결해 보세요.</section>'}`}
function openProject(id){page='projects';projectFocus=id;render()};function noteRow(n){return `<div class="item"><div class="grow" onclick="openForm('note','${n.id}')" style="cursor:pointer"><div class="name">${esc(n.title)}</div><div class="meta">${esc(projectName(n.project)||'자유 메모')}</div><p class="note">${esc(n.body).slice(0,180)}</p></div><button class="iconbtn" onclick="openForm('note','${n.id}')">✎</button></div>`}function notes(){return `<section class="card"><div class="row between"><h2>메모 및 기록</h2><button class="action" onclick="openForm('note')">+ 메모</button></div>${data.notes.length?data.notes.map(noteRow).join(''):'<div class="empty">첫 메모를 작성해 보세요.</div>'}</section>`}
function ai(){return `<section class="card"><h2>홍 AI <span class="pill">데모</span></h2><div class="alert">현재는 실제 AI 모델이 연결되지 않았어요. 등록된 데이터를 바탕으로 기본 질문에 응답하는 시연 화면이에요.</div><div id="chatLog" style="margin-top:12px">${data.chat.map(m=>`<div class="bubble ${m.role==='user'?'user':'ai'}">${esc(m.text)}</div>`).join('')||'<div class="bubble ai">안녕하세요. 오늘 일정, 할 일, 프로젝트 현황을 물어보세요.</div>'}</div><div class="quick"><input class="field" id="chatInput" placeholder="오늘 할 일 알려줘" onkeydown="if(event.key==='Enter')sendChat()"><button class="action" onclick="sendChat()">전송</button></div></section>`}
function sendChat(){let q=document.getElementById('chatInput')?.value.trim();if(!q)return;let a='현재는 시연 버전이에요. “오늘 일정”, “할 일”, “프로젝트”를 물어보면 저장된 정보를 확인할 수 있어요.';if(/일정|회의|약속/.test(q))a=`오늘 등록된 일정은 ${eventsOn(today()).length}개예요. ${eventsOn(today()).map(e=>e.title).join(', ')||'아직 일정이 없어요.'}`;else if(/할 일|업무|우선순위|마감/.test(q))a=`미완료 할 일은 ${data.tasks.filter(t=>!t.done).length}개예요. ${data.tasks.filter(t=>!t.done).sort(prioritySort).slice(0,3).map(t=>t.title).join(', ')||'현재 미완료 업무가 없어요.'}`;else if(/프로젝트/.test(q))a=`등록된 프로젝트는 ${data.projects.length}개예요. ${data.projects.map(p=>p.name).join(', ')||'아직 프로젝트가 없어요.'}`;data.chat.push({role:'user',text:q},{role:'ai',text:a});save()}
function render(){renderNav();document.getElementById('pageTitle').textContent=({home:'오늘의 홍',calendar:'캘린더',tasks:'할 일',projects:'프로젝트',notes:'메모 및 기록',ai:'홍 AI'})[page];document.getElementById('pageSub').textContent=page==='home'?'필요한 정보만 한눈에':page==='ai'?'현재는 규칙 기반 데모입니다':'홍과 함께 정리하는 하루';document.getElementById('content').innerHTML=({home,calendar,tasks,projects,notes,ai})[page]()}
function toggleTask(id){let t=data.tasks.find(t=>t.id===id);if(t){t.done=!t.done;save()}}
function projectOptions(value){return `<option value="">프로젝트 없음</option>${data.projects.map(p=>`<option value="${p.id}" ${value===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}`}
function openForm(type,id=null,prefillProject=''){let list=({task:'tasks',event:'events',project:'projects',note:'notes'})[type],o=list?data[list].find(x=>x.id===id)||{}:{};let title=({task:'할 일',event:'일정',project:'프로젝트',note:'메모',quick:'홍에게 바로 등록'})[type];let fields=type==='quick'?`<label class="wide">말하듯 입력해 보세요<input class="field" id="quickText" placeholder="내일 오후 3시 씽크핏 회의 잡아줘" required></label><div class="hint wide">입력 후 날짜와 시간 등을 확인하고 저장할 수 있어요.</div>`:type==='project'?`<label class="wide">프로젝트 이름<input class="field" name="name" value="${esc(o.name||'')}" required></label><label class="wide">목표<textarea class="field" name="goal" rows="3">${esc(o.goal||'')}</textarea></label>`:type==='note'?`<label class="wide">제목<input class="field" name="title" value="${esc(o.title||'')}" required></label><label class="wide">내용<textarea class="field" name="body" rows="6">${esc(o.body||'')}</textarea></label><label class="wide">프로젝트<select class="field" name="project">${projectOptions(o.project||prefillProject)}</select></label>`:`<label class="wide">제목<input class="field" name="title" value="${esc(o.title||'')}" required></label><label>날짜<input class="field" type="date" name="date" value="${esc(o.date||selected||today())}"></label><label>시간<input class="field" type="time" name="time" value="${esc(o.time||'')}"></label>${type==='task'?`<label>중요도<select class="field" name="priority">${['높음','보통','낮음'].map(v=>`<option ${v===(o.priority||'보통')?'selected':''}>${v}</option>`).join('')}</select></label>`:''}<label>반복<select class="field" name="repeat">${[['none','없음'],['daily','매일'],['weekly','매주'],['monthly','매월']].map(([v,n])=>`<option value="${v}" ${v===(o.repeat||'none')?'selected':''}>${n}</option>`).join('')}</select></label><label class="wide">프로젝트<select class="field" name="project">${projectOptions(o.project||prefillProject)}</select></label>`;document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between"><h2>${id?'수정 · ':''}${title}</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><form id="editForm" onsubmit="submitForm(event,'${type}','${id||''}')"><div class="formgrid">${fields}</div><div class="formactions">${id?`<button type="button" class="action danger" onclick="deleteItem('${type}','${id}')">삭제</button>`:''}<button type="button" class="action ghost" onclick="closeModal()">취소</button><button type="submit" class="action">${type==='quick'?'내용 분석':'저장'}</button></div></form></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}function deleteItem(type,id){if(!confirm('정말 삭제할까요?'))return;const k={task:'tasks',event:'events',project:'projects',note:'notes'}[type];data[k]=data[k].filter(x=>x.id!==id);if(type==='project'){for(let t of [...data.tasks,...data.events,...data.notes])if(t.project===id)t.project='';projectFocus=null}closeModal();save()}
function submitForm(ev,type,id){ev.preventDefault();if(type==='quick'){let input=document.getElementById('quickText').value;closeModal();quickParse(input);return}const form=new FormData(ev.target),k={task:'tasks',event:'events',project:'projects',note:'notes'}[type];let obj={};for(let [key,value] of form)obj[key]=String(value).trim();if(type==='task')obj.done=data.tasks.find(x=>x.id===id)?.done||false;if(id){let idx=data[k].findIndex(x=>x.id===id);data[k][idx]={...data[k][idx],...obj}}else data[k].push({id:uid(),...obj});closeModal();save()}
function quickParse(text){text=String(text||'').trim();if(!text)return;let d=new Date();if(/모레/.test(text))d.setDate(d.getDate()+2);else if(/내일/.test(text))d.setDate(d.getDate()+1);else if(/다음\s*주/.test(text))d.setDate(d.getDate()+7);let exact=text.match(/(\d{1,2})월\s*(\d{1,2})일/);if(exact){d.setMonth(Number(exact[1])-1,Number(exact[2]))}let date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;let tm=text.match(/(오전|오후)?\s*(\d{1,2})시(?:\s*(\d{1,2})분)?/),time='';if(tm){let h=Number(tm[2]);if(tm[1]==='오후'&&h<12)h+=12;if(tm[1]==='오전'&&h===12)h=0;time=String(h).padStart(2,'0')+':'+String(Number(tm[3]||0)).padStart(2,'0')}let priority=/중요|긴급|높음|급해/.test(text)?'높음':/낮음|여유/.test(text)?'낮음':'보통';let type=/회의|약속|미팅|예약|상담|일정|잡아줘/.test(text)?'event':'task';let title=text.replace(/오늘|내일|모레|다음\s*주|\d{1,2}월\s*\d{1,2}일|(?:오전|오후)?\s*\d{1,2}시(?:\s*\d{1,2}분)?|중요도는?\s*(높음|보통|낮음)|긴급|급해|잡아줘|등록해\s*줘|추가해\s*줘/g,' ').replace(/[,.]/g,' ').replace(/\s+/g,' ').trim()||text;const proj=data.projects.find(p=>text.includes(p.name));closeModal();openForm(type);let f=document.getElementById('editForm');f.elements.title.value=title;f.elements.date.value=date;f.elements.time.value=time;if(f.elements.priority)f.elements.priority.value=priority;if(proj)f.elements.project.value=proj.id;let hint=document.createElement('div');hint.className='alert';hint.textContent='홍이 문장을 분석했어요. 내용이 맞는지 확인한 뒤 저장해 주세요.';f.prepend(hint)}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
