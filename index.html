const KEY='hong_v01_data';const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const initial={tasks:[],events:[],projects:[],notes:[],chat:[],routines:[],routineChecks:{},rules:[],settings:{}};let data;try{data={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data=structuredClone(initial)};let page='home',filter='all',selected=today(),month=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0'),projectFocus=null;const labels={home:'홈 대시보드',tasks:'할 일',routines:'데일리 루틴',calendar:'캘린더',projects:'프로젝트',notes:'메모·기록',ai:'홍 AI',settings:'설정'},symbols={home:'⌂',tasks:'☑',routines:'↻',calendar:'▦',projects:'▤',notes:'▧',ai:'✧',settings:'⚙'};const uid=()=>String(Date.now())+Math.random().toString(36).slice(2,7);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{localStorage.setItem(KEY,JSON.stringify(data));render()};const fmt=d=>d?d.replaceAll('-','.'): '기한 없음';const projectName=id=>data.projects.find(p=>p.id===id)?.name||'';const pchip=p=>`<span class="chip ${p==='높음'?'high':p==='낮음'?'low':'normal'}">${esc(p||'보통')}</span>`;function nav(p){page=p;projectFocus=null;render();window.scrollTo(0,0)}function renderNav(){document.getElementById('sideNav').innerHTML=Object.keys(labels).map(p=>`<button class="sidebtn ${page===p?'active':''}" onclick="nav('${p}')">${symbols[p]}　${labels[p]}</button>`).join('');document.getElementById('bottomNav').innerHTML=['home','tasks','routines','calendar','settings'].map(p=>`<button class="${page===p?'active':''}" onclick="nav('${p}')"><span class="sym">${symbols[p]}</span>${labels[p]}</button>`).join('')}
function taskRow(t){return `<div class="item ${t.done?'done':''}"><input class="check" aria-label="완료" type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div class="grow" onclick="openForm('task','${t.id}')" style="cursor:pointer"><div class="name">${esc(t.title)}</div><div class="meta">${t.date?'마감 '+fmt(t.date):'기한 없음'}${t.time?' · '+esc(t.time):''}${t.startDate?' · 실행 '+fmt(t.startDate):''}${projectName(t.project)?' · '+esc(projectName(t.project)):''}${t.repeat&&t.repeat!=='none'?' · ↻ '+({daily:'매일',weekly:'매주',monthly:'매월'}[t.repeat]||'반복'):''}</div></div>${pchip(t.priority)}<button class="iconbtn" aria-label="수정" onclick="openForm('task','${t.id}')">✎</button></div>`}
function eventRow(e){return `<div class="item"><span style="color:#a9c9fb">◷</span><div class="grow" onclick="openForm('event','${e.id}')" style="cursor:pointer"><div class="name">${esc(e.title)}</div><div class="meta">${fmt(e.date)}${e.time?' · '+esc(e.time):''}${projectName(e.project)?' · '+esc(projectName(e.project)):''}${e.repeat&&e.repeat!=='none'?' · ↻ 반복':''}</div></div><button class="iconbtn" onclick="openForm('event','${e.id}')">✎</button></div>`}
function occurrences(o,date){if(!o.date||date<o.date)return false;if(o.date===date)return true;if(!o.repeat||o.repeat==='none')return false;const a=new Date(o.date+'T12:00'),b=new Date(date+'T12:00');if(o.repeat==='daily')return true;if(o.repeat==='weekly')return Math.round((b-a)/86400000)%7===0;if(o.repeat==='monthly')return a.getDate()===b.getDate();return false}
function tasksOn(date){return data.tasks.filter(t=>occurrences(t,date)&&!t.done)}function eventsOn(date){return data.events.filter(e=>occurrences(e,date))}function prioritySort(a,b){return ({'높음':0,'보통':1,'낮음':2}[a.priority]??1)-({'높음':0,'보통':1,'낮음':2}[b.priority]??1)}
let briefExpanded=false;
function recommendedHomeTasks(td){const open=data.tasks.filter(t=>!t.done);const todayAndOverdue=open.filter(t=>t.date&&t.date<=td||t.repeat&&t.repeat!=='none'&&occurrences(t,td));const unique=[...new Map(todayAndOverdue.map(t=>[t.id,t])).values()];return unique.sort((a,b)=>{const ad=a.date&&a.date<td&&!a.repeat,bd=b.date&&b.date<td&&!b.repeat;if(ad!==bd)return ad?-1:1;const p=prioritySort(a,b);if(p)return p;const da=(a.date||'9999-12-31')+' '+(a.time||'23:59'),db=(b.date||'9999-12-31')+' '+(b.time||'23:59');return da.localeCompare(db)})}
function toggleHomeBrief(){briefExpanded=!briefExpanded;render()}
function sortHomeTasks(a,b){const pr=prioritySort(a,b);const da=a.date||'9999-12-31',db=b.date||'9999-12-31';if(a.date&&a.date<today()&&!(b.date&&b.date<today()))return -1;if(b.date&&b.date<today()&&!(a.date&&a.date<today()))return 1;return pr||da.localeCompare(db)}
function homeTaskRow(t){return `<div class="item ${t.done?'done':''}"><input class="check" type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div class="grow" onclick="openForm('task','${t.id}')"><div class="name">${esc(t.title)}</div><div class="meta">${esc(t.category||projectName(t.project)||'일반 업무')}${t.startDate?' · 실행 '+fmt(t.startDate):''}</div></div><span class="due-tag ${t.date&&t.date<today()?'late':''}">${t.date?fmt(t.date):'기한 없음'}</span></div>`}
function routineDue(r){const wd=new Date().getDay();return r.repeat==='daily'||r.repeat==='weekdays'&&wd>=1&&wd<=5||r.repeat==='weekly'&&Number(r.weekday)===wd}
function routineDone(r){return !!(data.routineChecks[today()]||{})[r.id]}
function toggleRoutine(id){data.routineChecks[today()]??={};data.routineChecks[today()][id]=!data.routineChecks[today()][id];save()}
function routineRow(r){return `<div class="item ${routineDone(r)?'done':''}"><input class="check" type="checkbox" ${routineDone(r)?'checked':''} onchange="toggleRoutine('${r.id}')"><div class="grow" onclick="openRoutine('${r.id}')"><div class="name">${esc(r.title)}</div></div><button class="iconbtn" onclick="openRoutine('${r.id}')">✎</button></div>`}
let homeTab='events';
function home(){const td=today(),open=data.tasks.filter(t=>!t.done).sort(sortHomeTasks),due=data.tasks.filter(t=>!t.done&&t.date&&t.date<td),evs=data.events.filter(e=>e.date>=td).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)),routines=data.routines.filter(routineDue),completed=routines.filter(routineDone).length,projects=data.projects,first=open[0];let brief=due.length?`기한이 지난 업무 ${due.length}개를 먼저 확인해 주세요.`:first?`추천 업무는 ‘${esc(first.title)}’입니다.`:'등록된 미완료 업무가 없어요.';return `<div class="v4-home">
<div class="v4-top"><section class="card home-brief"><div class="row between"><h2>✧ 홍의 오늘 브리핑</h2><span class="pill">규칙 기반</span></div><p class="brief-lead">${brief} 오늘 일정 ${evs.filter(e=>e.date===td).length}개 · 루틴 ${completed}/${routines.length}개 완료.</p>${briefExpanded?`<div class="brief-detail"><p>추천: ${first?esc(first.title):'새 업무를 등록해 보세요.'}</p><p>기한 없는 업무도 중요도에 따라 추천 목록에 포함됩니다.</p><p class="hint">실제 AI 연결 없이 규칙으로 안내합니다.</p></div>`:''}<button class="brief-toggle" onclick="toggleHomeBrief()">${briefExpanded?'접기 ↑':'브리핑 더보기 ↓'}</button></section><section class="card"><h2>오늘의 현황 <span class="muted small">${fmt(td)}</span></h2><div class="stats"><div class="stat"><span class="small muted">미완료 업무</span><b>${open.length}</b></div><div class="stat"><span class="small muted">예정 일정</span><b>${evs.length}</b></div><div class="stat"><span class="small muted">진행 프로젝트</span><b>${projects.length}</b></div></div></section></div>
<div class="v4-middle"><section class="card"><div class="row between"><h2>☑ 해야 할 일 <span class="muted small">${open.length}개</span></h2><button class="action ghost" onclick="openForm('task')">+ 등록</button></div><div class="tabs compact">${[['all','전체'],['today','오늘'],['week','이번 주'],['none','기한 없음']].map(([id,n])=>`<button class="${homeFilter===id?'active':''}" onclick="homeFilter='${id}';render()">${n}</button>`).join('')}</div>${(()=>{const end=new Date();end.setDate(end.getDate()+7);const week=end.toISOString().slice(0,10);const list=open.filter(t=>homeFilter==='all'||homeFilter==='today'&&(t.date===td||t.startDate===td)||homeFilter==='week'&&t.date&&t.date<=week||homeFilter==='none'&&!t.date);return list.length?list.slice(0,9).map(homeTaskRow).join(''):'<div class="empty">해당하는 업무가 없어요.</div>'})()}<button class="iconbtn" onclick="nav('tasks')">전체 업무 보기 ›</button></section>
<section class="card"><div class="row between"><h2>↻ 데일리 루틴 <span class="muted small">${completed}/${routines.length} 완료</span></h2><button class="action ghost" onclick="openRoutine()">+ 추가</button></div><div class="progress" style="margin:12px 0 16px"><div style="width:${routines.length?completed/routines.length*100:0}%"></div></div>${routines.length?routines.slice(0,9).map(routineRow).join(''):'<div class="empty">매일 반복할 업무를 등록해 보세요.</div>'}<button class="iconbtn" onclick="nav('routines')">루틴 관리 ›</button></section></div>
<div class="v4-bottom"><section class="card"><div class="row between"><h2>▦ 일정 및 프로젝트</h2><div class="tabs compact"><button class="${homeTab==='events'?'active':''}" onclick="homeTab='events';render()">예정 일정</button><button class="${homeTab==='projects'?'active':''}" onclick="homeTab='projects';render()">프로젝트</button></div></div>${homeTab==='events'?(evs.length?evs.slice(0,5).map(eventRow).join(''):'<div class="empty">예정된 일정이 없어요.</div>'):(projects.length?projects.slice(0,5).map(projectLine).join(''):'<div class="empty">프로젝트를 추가해 보세요.</div>')}</section><section class="card"><div class="row between"><h2>▤ 프로젝트 진행 현황</h2><button class="iconbtn" onclick="nav('projects')">전체 ›</button></div>${projects.length?projects.slice(0,5).map(projectLine).join(''):'<div class="empty">프로젝트를 추가해 보세요.</div>'}</section></div></div><div class="home-quickbar"><span class="home-quick-label">✧</span><input class="field" id="homeQuick" aria-label="홍에게 바로 등록" placeholder="홍에게 할 일이나 일정을 말해줘" onkeydown="if(event.key==='Enter')quickParse(this.value)"><button class="action" onclick="quickParse(document.getElementById('homeQuick').value)">분석 ↑</button></div>`}
let homeFilter='all';

function projectLine(p){const ts=data.tasks.filter(t=>t.project===p.id),done=ts.filter(t=>t.done).length,percent=ts.length?Math.round(done/ts.length*100):0;return `<div style="margin:12px 0;cursor:pointer" onclick="openProject('${p.id}')"><div class="row between small"><span>${esc(p.name)}</span><span class="muted">${done}/${ts.length} · ${percent}%</span></div><div class="progress" style="margin-top:7px"><div style="width:${percent}%"></div></div></div>`}
function calendar(){const [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();let cells=Array.from({length:first},()=>'<div class="day blank"></div>').join('');for(let d=1;d<=days;d++){let date=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells+=`<button class="day ${selected===date?'selected':''}" onclick="selected='${date}';render()">${d}<span class="dots">${eventsOn(date).length?'●':''}${tasksOn(date).length?' ●':''}</span></button>`}return `<section class="card"><div class="monthbar"><button class="iconbtn" onclick="changeMonth(-1)">‹</button><b>${y}년 ${m}월</b><button class="iconbtn" onclick="changeMonth(1)">›</button></div><div class="calendar">${['일','월','화','수','목','금','토'].map(x=>`<div class="small muted" style="text-align:center">${x}</div>`).join('')}${cells}</div><div class="row between"><b>${fmt(selected)}</b><div><button class="action ghost" onclick="openForm('task')">+ 할 일</button> <button class="action" onclick="openForm('event')">+ 일정</button></div></div><h2 style="margin-top:20px">일정</h2>${eventsOn(selected).length?eventsOn(selected).map(eventRow).join(''):'<div class="empty">일정 없음</div>'}<h2 style="margin-top:18px">할 일 마감</h2>${tasksOn(selected).length?tasksOn(selected).map(taskRow).join(''):'<div class="empty">할 일 없음</div>'}</section>`}
function changeMonth(n){let [y,m]=month.split('-').map(Number);let d=new Date(y,m-1+n,1);month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');selected=month+'-01';render()}
function tasks(){let list=data.tasks.filter(t=>filter==='all'||(filter==='today'&&occurrences(t,today()))||(filter==='upcoming'&&!t.done&&t.date>today())||(filter==='done'&&t.done)).sort((a,b)=>Number(a.done)-Number(b.done)||prioritySort(a,b));return `<div class="tabs">${[['all','전체'],['today','오늘'],['upcoming','예정'],['done','완료']].map(([id,n])=>`<button class="${filter===id?'active':''}" onclick="filter='${id}';render()">${n}</button>`).join('')}</div><section class="card"><div class="row between"><h2>할 일 ${list.length}개</h2><button class="action" onclick="openForm('task')">+ 추가</button></div>${list.length?list.map(taskRow).join(''):'<div class="empty">해당하는 할 일이 없어요.</div>'}</section>`}
function projects(){if(projectFocus){const p=data.projects.find(x=>x.id===projectFocus);if(!p){projectFocus=null;return projects()}return `<button class="iconbtn" onclick="projectFocus=null;render()">‹ 프로젝트 목록</button><section class="card"><div class="row between"><h2>${esc(p.name)}</h2><button class="action ghost" onclick="openForm('project','${p.id}')">수정</button></div><p class="muted small">${esc(p.goal||'목표를 설정해 보세요.')}</p>${projectLine(p)}</section><section class="card"><div class="row between"><h2>연결된 할 일</h2><button class="action" onclick="openForm('task',null,'${p.id}')">+ 추가</button></div>${data.tasks.filter(t=>t.project===p.id).map(taskRow).join('')||'<div class="empty">할 일이 없어요.</div>'}</section><section class="card"><div class="row between"><h2>연결된 일정</h2><button class="action" onclick="openForm('event',null,'${p.id}')">+ 추가</button></div>${data.events.filter(e=>e.project===p.id).map(eventRow).join('')||'<div class="empty">일정이 없어요.</div>'}</section><section class="card"><div class="row between"><h2>연결된 메모</h2><button class="action" onclick="openForm('note',null,'${p.id}')">+ 추가</button></div>${data.notes.filter(n=>n.project===p.id).map(noteRow).join('')||'<div class="empty">메모가 없어요.</div>'}</section>`}return `<div class="row between" style="margin-bottom:12px"><span class="muted small">프로젝트 ${data.projects.length}개</span><button class="action" onclick="openForm('project')">+ 새 프로젝트</button></div>${data.projects.length?data.projects.map(p=>`<section class="card project" onclick="openProject('${p.id}')"><h3>${esc(p.name)}</h3><p>${esc(p.goal||'목표 없음')}</p>${projectLine(p)}</section>`).join(''):'<section class="card empty">프로젝트를 만들어 목표와 할 일을 연결해 보세요.</section>'}`}
function openProject(id){page='projects';projectFocus=id;render()};function noteRow(n){return `<div class="item"><div class="grow" onclick="openForm('note','${n.id}')" style="cursor:pointer"><div class="name">${esc(n.title)}</div><div class="meta">${esc(projectName(n.project)||'자유 메모')}</div><p class="note">${esc(n.body).slice(0,180)}</p></div><button class="iconbtn" onclick="openForm('note','${n.id}')">✎</button></div>`}function notes(){return `<section class="card"><div class="row between"><h2>메모 및 기록</h2><button class="action" onclick="openForm('note')">+ 메모</button></div>${data.notes.length?data.notes.map(noteRow).join(''):'<div class="empty">첫 메모를 작성해 보세요.</div>'}</section>`}
function ai(){return `<section class="card"><h2>홍 AI <span class="pill">데모</span></h2><div class="alert">현재는 실제 AI 모델이 연결되지 않았어요. 등록된 데이터를 바탕으로 기본 질문에 응답하는 시연 화면이에요.</div><div id="chatLog" style="margin-top:12px">${data.chat.map(m=>`<div class="bubble ${m.role==='user'?'user':'ai'}">${esc(m.text)}</div>`).join('')||'<div class="bubble ai">안녕하세요. 오늘 일정, 할 일, 프로젝트 현황을 물어보세요.</div>'}</div><div class="quick"><input class="field" id="chatInput" placeholder="오늘 할 일 알려줘" onkeydown="if(event.key==='Enter')sendChat()"><button class="action" onclick="sendChat()">전송</button></div></section>`}
function sendChat(){let q=document.getElementById('chatInput')?.value.trim();if(!q)return;let a='현재는 시연 버전이에요. “오늘 일정”, “할 일”, “프로젝트”를 물어보면 저장된 정보를 확인할 수 있어요.';if(/일정|회의|약속/.test(q))a=`오늘 등록된 일정은 ${eventsOn(today()).length}개예요. ${eventsOn(today()).map(e=>e.title).join(', ')||'아직 일정이 없어요.'}`;else if(/할 일|업무|우선순위|마감/.test(q))a=`미완료 할 일은 ${data.tasks.filter(t=>!t.done).length}개예요. ${data.tasks.filter(t=>!t.done).sort(prioritySort).slice(0,3).map(t=>t.title).join(', ')||'현재 미완료 업무가 없어요.'}`;else if(/프로젝트/.test(q))a=`등록된 프로젝트는 ${data.projects.length}개예요. ${data.projects.map(p=>p.name).join(', ')||'아직 프로젝트가 없어요.'}`;data.chat.push({role:'user',text:q},{role:'ai',text:a});save()}
function routines(){const list=data.routines;const count=list.filter(routineDue).length;return `<section class="card"><div class="row between"><h2>데일리 루틴 <span class="muted small">오늘 ${count}개</span></h2><button class="action" onclick="openRoutine()">+ 루틴 추가</button></div><p class="muted small">반복 주기에 맞춰 오늘의 체크리스트가 나타납니다. 완료 기록은 날짜별로 저장됩니다.</p>${list.length?list.map(r=>`<div class="item"><div class="grow"><div class="name">${esc(r.title)}</div><div class="meta">${r.repeat==='daily'?'매일':r.repeat==='weekdays'?'평일':'매주 '+['일','월','화','수','목','금','토'][Number(r.weekday)]+'요일'} · ${routineDue(r)?routineDone(r)?'오늘 완료':'오늘 미완료':'오늘 제외'}</div></div><button class="iconbtn" onclick="openRoutine('${r.id}')">수정</button></div>`).join(''):'<div class="empty">반복 업무를 등록해 보세요.</div>'}</section>`}
function openRoutine(id=''){const r=data.routines.find(x=>x.id===id)||{};document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between"><h2>${id?'루틴 수정':'루틴 추가'}</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><form onsubmit="saveRoutine(event,'${id}')"><div class="formgrid"><label class="wide">루틴 이름<input class="field" name="title" value="${esc(r.title||'')}" required></label><label>반복 주기<select class="field" name="repeat">${[['daily','매일'],['weekdays','평일'],['weekly','매주 지정 요일']].map(([v,n])=>`<option value="${v}" ${v===(r.repeat||'daily')?'selected':''}>${n}</option>`).join('')}</select></label><label>지정 요일 (매주일 때)<select class="field" name="weekday">${['일','월','화','수','목','금','토'].map((v,i)=>`<option value="${i}" ${Number(r.weekday||0)===i?'selected':''}>${v}요일</option>`).join('')}</select></label></div><div class="formactions">${id?`<button type="button" class="action danger" onclick="deleteRoutine('${id}')">삭제</button>`:''}<button type="button" class="action ghost" onclick="closeModal()">취소</button><button class="action">저장</button></div></form></div></div>`}
function saveRoutine(e,id){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));if(id)Object.assign(data.routines.find(r=>r.id===id),o);else data.routines.push({id:uid(),...o});closeModal();save()}
function deleteRoutine(id){if(!confirm('루틴을 삭제할까요?'))return;data.routines=data.routines.filter(r=>r.id!==id);closeModal();save()}
function settings(){return `<section class="card"><h2>⚙ 설정</h2><p class="muted small">홍의 판단 규칙을 직접 추가할 수 있어요. 규칙은 이 기기에만 저장됩니다.</p><h3>홍의 판단 규칙</h3>${data.rules.map(r=>`<div class="item"><div class="grow"><div class="name">${esc(r.keyword)} → ${esc(r.category)}</div><div class="meta">키워드가 포함된 업무의 카테고리를 추천</div></div><button class="iconbtn" onclick="deleteRule('${r.id}')">삭제</button></div>`).join('')||'<div class="empty">아직 추가한 규칙이 없어요. 기본 규칙은 계속 적용됩니다.</div>'}<form onsubmit="addRule(event)" class="formgrid" style="margin-top:14px"><label>인식할 표현<input class="field" name="keyword" placeholder="예: 대표님께 보고" required></label><label>추천 카테고리<input class="field" name="category" placeholder="예: 보고" required></label><button class="action">+ 규칙 추가</button></form><h3>데이터 관리</h3><div class="row" style="gap:8px;flex-wrap:wrap"><button class="action ghost" onclick="exportData()">JSON 백업 다운로드</button><button class="action ghost" onclick="document.getElementById('restoreFile').click()">백업 복원</button><input id="restoreFile" type="file" accept="application/json" style="display:none" onchange="restoreData(this)"></div><p class="hint">복원하면 현재 기기의 홍 데이터가 백업 내용으로 대체됩니다.</p></section>`}
function addRule(e){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));data.rules.push({id:uid(),keyword:o.keyword.trim(),category:o.category.trim()});save()}
function deleteRule(id){data.rules=data.rules.filter(r=>r.id!==id);save()}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='hong-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreData(input){const f=input.files?.[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!Array.isArray(o.tasks)||!Array.isArray(o.events))throw Error('형식 오류');if(!confirm('현재 데이터를 백업 내용으로 대체할까요?'))return;data={...initial,...o};save()}catch(e){alert('복원할 수 없는 파일입니다: '+e.message)}})}
function render(){renderNav();document.getElementById("headerDate").textContent=new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date());document.getElementById('pageTitle').textContent=({home:'오늘의 홍',calendar:'캘린더',tasks:'할 일',routines:'데일리 루틴',projects:'프로젝트',notes:'메모 및 기록',ai:'홍 AI',settings:'설정'})[page];document.getElementById('pageSub').textContent=page==='home'?'필요한 정보만 한눈에':page==='ai'?'현재는 규칙 기반 데모입니다':'홍과 함께 정리하는 하루';document.getElementById('content').innerHTML=({home,calendar,tasks,routines,projects,notes,ai,settings})[page]()}
function toggleTask(id){let t=data.tasks.find(t=>t.id===id);if(t){t.done=!t.done;save()}}
function projectOptions(value){return `<option value="">프로젝트 없음</option>${data.projects.map(p=>`<option value="${p.id}" ${value===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}`}
function openForm(type,id=null,prefillProject=''){let list=({task:'tasks',event:'events',project:'projects',note:'notes'})[type],o=list?data[list].find(x=>x.id===id)||{}:{};let title=({task:'할 일',event:'일정',project:'프로젝트',note:'메모',quick:'홍에게 바로 등록'})[type];let fields=type==='quick'?`<label class="wide">말하듯 입력해 보세요<input class="field" id="quickText" placeholder="내일 오후 3시 씽크핏 회의 잡아줘" required></label><div class="hint wide">입력 후 날짜와 시간 등을 확인하고 저장할 수 있어요.</div>`:type==='project'?`<label class="wide">프로젝트 이름<input class="field" name="name" value="${esc(o.name||'')}" required></label><label class="wide">목표<textarea class="field" name="goal" rows="3">${esc(o.goal||'')}</textarea></label>`:type==='note'?`<label class="wide">제목<input class="field" name="title" value="${esc(o.title||'')}" required></label><label class="wide">내용<textarea class="field" name="body" rows="6">${esc(o.body||'')}</textarea></label><label class="wide">프로젝트<select class="field" name="project">${projectOptions(o.project||prefillProject)}</select></label>`:`<label class="wide">제목<input class="field" name="title" value="${esc(o.title||'')}" required></label><label>${type==='task'?'마감기한 (선택)':'일정 날짜'}<input class="field" type="date" name="date" value="${esc(o.date||(type==='event'?selected||today():''))}"></label><label>시간<input class="field" type="time" name="time" value="${esc(o.time||'')}"></label>${type==='task'?`<label>실행 예정일 (선택)<input class="field" type="date" name="startDate" value="${esc(o.startDate||'')}"></label><label>업무 카테고리<input class="field" name="category" value="${esc(o.category||'')}" placeholder="예: 시설 관리"></label><label class="wide">세부 내용<textarea class="field" name="description" rows="3">${esc(o.description||'')}</textarea></label><label>중요도<select class="field" name="priority">${['높음','보통','낮음'].map(v=>`<option ${v===(o.priority||'보통')?'selected':''}>${v}</option>`).join('')}</select></label>`:''}<label>반복<select class="field" name="repeat">${[['none','없음'],['daily','매일'],['weekly','매주'],['monthly','매월']].map(([v,n])=>`<option value="${v}" ${v===(o.repeat||'none')?'selected':''}>${n}</option>`).join('')}</select></label><label class="wide">프로젝트<select class="field" name="project">${projectOptions(o.project||prefillProject)}</select></label>`;document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between"><h2>${id?'수정 · ':''}${title}</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><form id="editForm" onsubmit="submitForm(event,'${type}','${id||''}')"><div class="formgrid">${fields}</div><div class="formactions">${id?`<button type="button" class="action danger" onclick="deleteItem('${type}','${id}')">삭제</button>`:''}<button type="button" class="action ghost" onclick="closeModal()">취소</button><button type="submit" class="action">${type==='quick'?'내용 분석':'저장'}</button></div></form></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}function deleteItem(type,id){if(!confirm('정말 삭제할까요?'))return;const k={task:'tasks',event:'events',project:'projects',note:'notes'}[type];data[k]=data[k].filter(x=>x.id!==id);if(type==='project'){for(let t of [...data.tasks,...data.events,...data.notes])if(t.project===id)t.project='';projectFocus=null}closeModal();save()}

function quickParse(text){text=String(text||'').trim();if(!text)return;let d=new Date(),date='',startDate='',time='';let hasDate=false;if(/모레/.test(text)){d.setDate(d.getDate()+2);hasDate=true}else if(/내일/.test(text)){d.setDate(d.getDate()+1);hasDate=true}else if(/오늘/.test(text)){hasDate=true}else if(/다음\s*주/.test(text)){d.setDate(d.getDate()+7);hasDate=true}let exact=text.match(/(\d{1,2})월\s*(\d{1,2})일/);if(exact){d.setMonth(Number(exact[1])-1,Number(exact[2]));hasDate=true}let parsed=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;let tm=text.match(/(오전|오후)?\s*(\d{1,2})시(?:\s*(\d{1,2})분)?/);if(tm){let h=Number(tm[2]);if(tm[1]==='오후'&&h<12)h+=12;if(tm[1]==='오전'&&h===12)h=0;if(h<24)time=String(h).padStart(2,'0')+':'+String(Number(tm[3]||0)).padStart(2,'0')}
let type=/회의|약속|미팅|예약|상담 일정|방문 일정/.test(text)?'event':'task';if(type==='event')date=hasDate?parsed:today();else if(hasDate){if(/까지|마감|기한|완료해야|제출해야/.test(text))date=parsed;else startDate=parsed}let priority=/긴급|급해|최우선|중요/.test(text)?'높음':/급한\s*건\s*아니|여유|천천히/.test(text)?'낮음':'보통';if(/급한\s*건\s*아니/.test(text))priority='낮음';let title=text.replace(/오늘|내일|모레|다음\s*주|\d{1,2}월\s*\d{1,2}일|(?:오전|오후)?\s*\d{1,2}시(?:\s*\d{1,2}분)?|까지|급한 건 아니야|긴급|급해|등록해\s*줘|추가해\s*줘|해야겠어|해야 해|해야겠다|할게|할 것|하려고 해|좀|먼저/g,' ').replace(/(해\s*주기로\s*했는지|해주는지)/g,'하는지').replace(/[,.!?]/g,' ').replace(/\s+/g,' ').trim();title=title.replace(/(확인하고|확인해서)/g,'확인 및').replace(/(정리해야|확인해야|연락해야|보고해야|작성해야)$/,'$1'.replace('해야',''));if(title.length>43)title=title.slice(0,42).replace(/\s+\S*$/,'')+'…';title=title||text;const proj=data.projects.find(p=>text.includes(p.name));const rule=data.rules.find(r=>r.keyword&&text.includes(r.keyword));let category=rule?.category||(/보고/.test(text)?'보고':/업체|시설|청소|차단기/.test(text)?'시설 관리':/매뉴얼|회원|FC/.test(text)?'센터 운영':/운동|러닝/.test(text)?'개인':'일반 업무');closeModal();openForm(type);let f=document.getElementById('editForm');f.elements.title.value=title;f.elements.date.value=date;f.elements.time.value=time;if(f.elements.startDate)f.elements.startDate.value=startDate;if(f.elements.description)f.elements.description.value=text;if(f.elements.priority)f.elements.priority.value=priority;if(proj)f.elements.project.value=proj.id;if(f.elements.category)f.elements.category.value=category;let hint=document.createElement('div');hint.className='alert';hint.textContent='홍이 규칙에 따라 정리했어요. 제목과 날짜를 확인한 뒤 저장해 주세요. 애매한 날짜는 비워둡니다.';f.prepend(hint)}

const v5Date=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const v5Weekday=['일','월','화','수','목','금','토'];
function v5DateInfo(text){const now=new Date(),d=new Date(now.getFullYear(),now.getMonth(),now.getDate());let matched=false;
 const explicit=text.match(/(20\d{2})[.\-/년]\s*(\d{1,2})[.\-/월]\s*(\d{1,2})일?/);const md=text.match(/(\d{1,2})월\s*(\d{1,2})일/);
 if(explicit){d.setFullYear(+explicit[1],+explicit[2]-1,+explicit[3]);matched=true}
 else if(md){d.setMonth(+md[1]-1,+md[2]);if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate()))d.setFullYear(d.getFullYear()+1);matched=true}
 else if(/모레/.test(text)){d.setDate(d.getDate()+2);matched=true}
 else if(/내일/.test(text)){d.setDate(d.getDate()+1);matched=true}
 else if(/오늘/.test(text)){matched=true}
 else {let w=text.match(/(다다음\s*주|다음\s*주|이번\s*주)\s*([월화수목금토일])요일/);if(w){const target=v5Weekday.indexOf(w[2]);const mon=(d.getDay()+6)%7;d.setDate(d.getDate()-mon+(w[1].includes('다다음')?14:w[1].includes('다음')?7:0)+(target+6)%7);matched=true}
 else if(/다음\s*주/.test(text)){d.setDate(d.getDate()+7);matched=true}else {const only=text.match(/([월화수목금토일])요일(?:까지|에|부터)?/);if(only){const target=v5Weekday.indexOf(only[1]);let delta=(target-d.getDay()+7)%7;if(delta===0&&/까지/.test(text))delta=0;d.setDate(d.getDate()+delta);matched=true}}}
 const tm=text.match(/(오전|오후)?\s*(\d{1,2})시(?:\s*(\d{1,2})분)?/);let time='';if(tm){let h=+tm[2],m=+(tm[3]||0);if(tm[1]==='오후'&&h<12)h+=12;if(tm[1]==='오전'&&h===12)h=0;if(h<24&&m<60)time=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
 return {date:matched?v5Date(d):'',time};}
function v5CleanTitle(text){let s=text.replace(/(20\d{2})[.\-/년]\s*\d{1,2}[.\-/월]\s*\d{1,2}일?|\d{1,2}월\s*\d{1,2}일|다다음\s*주|다음\s*주|이번\s*주|오늘|내일|모레|[월화수목금토일]요일|(?:오전|오후)?\s*\d{1,2}시(?:\s*\d{1,2}분)?/g,' ')
 .replace(/(?:프로젝트에\s*넣어줘|프로젝트로\s*관리해줘|프로젝트\s*만들어줘|등록해\s*줘|추가해\s*줘|정리해\s*줘|해줘|해야겠어|해야겠다|해야\s*해|해야\s*돼|할\s*게|하려고\s*해|해둘게|부탁해|기억해줘|급한\s*건\s*아니야|급하지\s*않아|천천히|마감|기한|까지)/g,' ')
 .replace(/^(나는|내가|우리|홍아|홍에게|우선|일단|좀|그럼)\s*/g,'').replace(/[.!?,]/g,' ').replace(/\s+/g,' ').trim();
 s=s.replace(/(연락하고|연락해서)/g,'연락 및').replace(/(확인하고|확인해서)/g,'확인 및').replace(/(정리하고|정리해서)/g,'정리 및');return s.slice(0,65)||text.slice(0,65)}
function v5ProjectMatch(text){return [...data.projects].sort((a,b)=>b.name.length-a.name.length).find(p=>text.includes(p.name))}
function v5Classify(text){const rule=data.rules.find(r=>r.keyword&&text.includes(r.keyword));return rule?.category||(/보고|대표님/.test(text)?'보고':/청소|시설|간판|업체|차단기|조명/.test(text)?'시설 관리':/FC|인포|회원|매뉴얼/.test(text)?'센터 운영':/러닝|운동/.test(text)?'개인':'일반 업무')}
function v5TaskCandidates(text){let parts=text.split(/\s*(?:;|\n|그리고\s+|또한\s+)\s*/).filter(Boolean);if(parts.length===1&&/(?:연락하고|확인하고|정리하고)\s+[^ ]+/.test(text)){parts=text.split(/(연락하고|확인하고|정리하고)\s+/);if(parts.length>=3)parts=[parts[0]+parts[1].replace('하고','하기'),parts.slice(2).join(' ')].filter(Boolean)}return parts.length>5?[text]:parts}
function v5MatchTask(text){let name=text.replace(/(?:업무|할\s*일|일정|을|를|은|는|이|가|좀|완료|처리|수정|변경|해줘|로|으로|마감일|날짜|기한|프로젝트|에|넣어줘|연결해줘)/g,' ').replace(/\s+/g,' ').trim();const matches=data.tasks.filter(t=>t.title.includes(name)||name.includes(t.title)||name.split(' ').filter(w=>w.length>1).some(w=>t.title.includes(w)));return matches.length===1?matches[0]:null}
function v5Analyze(raw){const text=raw.trim();const proj=v5ProjectMatch(text),dt=v5DateInfo(text),out=[];
 const creatingProject=/(?:프로젝트\s*(?:만들|생성|추가)|프로젝트로\s*(?:관리|만들))/.test(text);
 if(creatingProject){let title=text.replace(/(?:새로운?|프로젝트|만들어\s*줘|만들어줘|생성해\s*줘|추가해\s*줘|로\s*관리해\s*줘|해줘|를|을)/g,' ').replace(/\s+/g,' ').trim();out.push({type:'project',title:title||'새 프로젝트',description:text});return out}
 if(/(?:완료\s*처리|완료해\s*줘|끝냈어|마쳤어|끝났어)/.test(text)){const target=v5MatchTask(text);if(target)return [{type:'complete',target:target.id,title:target.title}];}
 if(/(?:마감일|기한|날짜).*(?:변경|수정|바꿔|로\s*해줘)/.test(text)){const target=v5MatchTask(text);if(target)return [{type:'update',target:target.id,title:target.title,date:dt.date,description:text}];}
 if(/(?:프로젝트에|프로젝트로).*(?:넣어|연결)/.test(text)&&proj){const task=v5MatchTask(text.replace(proj.name,''));if(task)return [{type:'link',target:task.id,title:task.title,project:proj.id}];}
 const routine=/매일|평일마다|매주\s*[월화수목금토일]요일/.test(text)&&!/회의|미팅|약속/.test(text);
 const type=routine?'routine':/회의|미팅|약속|예약|상담\s*일정|방문\s*일정/.test(text)?'event':'task';
 for(const part of v5TaskCandidates(text)){const d=v5DateInfo(part),effective=d.date?d:dt;const title=v5CleanTitle(part);const deadline=/(?:까지|마감|기한|제출|완료해야)/.test(part);const priority=/급한\s*건\s*아니|급하지\s*않아|천천히/.test(part)?'낮음':/긴급|급해|최우선|중요/.test(part)?'높음':'보통';
 out.push({type,title,description:part,date:type==='event'?effective.date:deadline?effective.date:'',startDate:type==='task'&&!deadline?effective.date:'',time:effective.time,priority,category:v5Classify(part),project:proj?.id||'',repeat:/평일/.test(part)?'weekdays':/매주/.test(part)?'weekly':'daily',weekday:(()=>{let w=part.match(/매주\s*([월화수목금토일])요일/);return w?String(v5Weekday.indexOf(w[1])):'1'})()});}

function v5Dup(obj){if(obj.type!=='task'&&obj.type!=='event')return null;return data[obj.type==='task'?'tasks':'events'].find(x=>!x.done&&x.title.replace(/\s/g,'')===obj.title.replace(/\s/g,'')&&(x.date||'')===(obj.date||''))}

function v5PreviewFields(o,i){const typeOptions=[['task','할 일'],['event','일정'],['project','프로젝트'],['routine','데일리 루틴'],['complete','업무 완료'],['update','마감일 변경'],['link','프로젝트 연결']];const special=['complete','update','link'].includes(o.type);return `<div class="preview-item"><div class="row between"><h3>${i+1}. 홍이 해석한 내용</h3><span class="pill">${esc(o.type)}</span></div><div class="formgrid"><label>처리 유형<select class="field" data-i="${i}" data-k="type" onchange="v5PreviewChange(this)">${typeOptions.map(([v,n])=>`<option value="${v}" ${o.type===v?'selected':''}>${n}</option>`).join('')}</select></label><label>제목 / 대상<input class="field" data-i="${i}" data-k="title" value="${esc(o.title)}" oninput="v5PreviewChange(this)"></label>${!special?`<label class="wide">세부 내용<textarea class="field" rows="2" data-i="${i}" data-k="description" oninput="v5PreviewChange(this)">${esc(o.description||'')}</textarea></label><label>마감일 / 일정일 (선택)<input class="field" type="date" data-i="${i}" data-k="date" value="${esc(o.date||'')}" onchange="v5PreviewChange(this)"></label><label>실행 예정일 (선택)<input class="field" type="date" data-i="${i}" data-k="startDate" value="${esc(o.startDate||'')}" onchange="v5PreviewChange(this)"></label><label>시간 (선택)<input class="field" type="time" data-i="${i}" data-k="time" value="${esc(o.time||'')}" onchange="v5PreviewChange(this)"></label><label>중요도<select class="field" data-i="${i}" data-k="priority" onchange="v5PreviewChange(this)">${['높음','보통','낮음'].map(v=>`<option ${v===o.priority?'selected':''}>${v}</option>`).join('')}</select></label><label>업무 분류<input class="field" data-i="${i}" data-k="category" value="${esc(o.category||'')}" oninput="v5PreviewChange(this)"></label>`:''}<label>프로젝트<select class="field" data-i="${i}" data-k="project" onchange="v5PreviewChange(this)">${projectOptions(o.project||'')}</select></label>${o.type==='update'?`<label>변경할 마감일<input class="field" type="date" data-i="${i}" data-k="date" value="${esc(o.date||'')}" onchange="v5Previe const v51OldPreviewFields=v5PreviewFields;
v5PreviewFields=function(o,i){const html=v51OldPreviewFields(o,i);const dup=v51Dup(o);return dup?html.replace('<button class="iconbtn" onclick="v5Preview.splice',`<p class="v51-duplicate">⚠ 기존 ${dup.done?'완료':'진행 중'} 업무: ${esc(dup.title)} · 중복 등록 여부를 실행 시 확인합니다.</p><button class="iconbtn" onclick="v5Preview.splice`):html};
v5ApplyPreview=function(){if(!v5Preview.length)return;if(v5Preview.some(o=>o.type==='event'&&!o.date||o.type==='update'&&!o.date)){alert('일정 또는 변경할 마감일을 지정해 주세요.');return}const backup=JSON.stringify(data);let count=0,skipped=0;for(const o of v5Preview){const dup=v51Dup(o);if(dup){const action=confirm(`이미 등록된 항목이 있어요.\n기존: ${dup.title}\n\n[확인] 그래도 새로 등록\n[취소] 중복 등록 건너뛰기`);if(!action){skipped++;continue}}if(o.type==='task'){data.tasks.push({id:uid(),title:o.title,description:o.description,date:o.date||'',startDate:o.startDate||'',time:o.time||'',priority:o.priority||'보통',category:o.category||'',project:o.project||'',repeat:'none',done:false});count++}else if(o.type==='event'){data.events.push({id:uid(),title:o.title,date:o.date,time:o.time||'',project:o.project||'',repeat:'none'});count++}else if(o.type==='project'){if(data.projects.some(p=>p.name===o.title)){skipped++;continue}data.projects.push({id:uid(),name:o.title,goal:o.description||''});count++}else if(o.type==='routine'){data.routines.push({id:uid(),title:o.title,repeat:o.repeat||'daily',weekday:o.weekday||'1',weekdays:o.weekdays||[Number(o.weekday||1)],order:data.routines.length});count++}else if(['complete','update','link'].includes(o.type)){const t=data.tasks.find(t=>t.id===o.target);if(!t){skipped++;continue}if(o.type==='complete')t.done=true;if(o.type==='update')t.date=o.date;if(o.type==='link')t.project=o.project;count++}}if(!count){alert(`적용할 항목이 없어요. ${skipped}개 건너뜀`);return}v5Undo=backup;closeModal();save();v5Toast(`${count}개 반영 완료${skipped?` · ${skipped}개 건너뜀`:''}`)};

if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
